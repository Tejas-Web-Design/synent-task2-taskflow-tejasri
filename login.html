<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | TaskFlow</title>

  <link rel="stylesheet" href="css/auth.css">

</head>

<body>

    

  <div class="auth-container">

    <div class="auth-card">

      <h1>TaskFlow</h1>

      <h2>Welcome Back</h2>

      <form>

        <input
        type="email"
        placeholder="Email Address"
        required>

        <input
        type="password"
        placeholder="Password"
        required>

        

        <button type="submit">
          Login
        </button>

      </form>

      <p>

        Don't have an account?

        <a href="signup.html">
          Create Account
        </a>

      </p>
      

    </div>

    <a href="index.html" class="btn">
        ← Back to Home
      </a>

  </div>

  

</body>
</html>
